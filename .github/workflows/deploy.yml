name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/marichu99/kwamz-ai-revamp/frontend
  CELERY_IMAGE: ghcr.io/marichu99/kwamz-ai-revamp/celery

jobs:
  # Build and push Docker images (frontend + celery)
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Extract metadata for celery
        id: meta-celery
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CELERY_IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./kwamz-ai
          file: ./kwamz-ai/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push celery
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.celery
          push: true
          tags: ${{ steps.meta-celery.outputs.tags }}
          labels: ${{ steps.meta-celery.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to DigitalOcean
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy backend code and configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          source: "backend/,nginx/"
          target: "~/projects/-kwamz-ai-revamp"

      - name: Deploy services
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          envs: GITHUB_TOKEN
          script: |
            set -e

            # --- Docker login ---
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # --- Frontend (Docker) ---
            docker pull ${{ env.FRONTEND_IMAGE }}:latest
            docker stop frontend 2>/dev/null || true
            docker rm frontend 2>/dev/null || true
            # Kill any other container still holding port 3000
            docker ps -q --filter "publish=3000" | xargs -r docker stop
            docker ps -aq --filter "publish=3000" | xargs -r docker rm
            docker run -d --name frontend \
              -p 3000:80 \
              --restart unless-stopped \
              ${{ env.FRONTEND_IMAGE }}:latest

            # --- Celery Worker (Docker) ---
            docker pull ${{ env.CELERY_IMAGE }}:latest
            docker stop celery-worker 2>/dev/null || true
            docker rm celery-worker 2>/dev/null || true
            docker run -d --name celery-worker \
              --network host \
              --env-file ~/projects/-kwamz-ai-revamp/backend/.env \
              --restart unless-stopped \
              ${{ env.CELERY_IMAGE }}:latest

            # --- Celery Beat (Docker, same image) ---
            docker stop celery-beat 2>/dev/null || true
            docker rm celery-beat 2>/dev/null || true
            docker run -d --name celery-beat \
              --network host \
              --env-file ~/projects/-kwamz-ai-revamp/backend/.env \
              --restart unless-stopped \
              ${{ env.CELERY_IMAGE }}:latest \
              celery -A worker:celery beat --loglevel=info

            # --- Backend (bare metal with conda) ---
            cd ~/projects/-kwamz-ai-revamp/backend

            source ~/miniconda3/etc/profile.d/conda.sh

            # Install dependencies using conda run (works in non-interactive SSH sessions)
            conda run -n kwamz pip install -q -r requirements.txt

            # Run database migrations
            conda run -n kwamz flask db upgrade

            # Restart gunicorn via supervisor
            sudo supervisorctl restart kwamz-backend

            # Reload nginx config
            sudo nginx -t && sudo systemctl reload nginx

            # Cleanup old Docker images
            docker image prune -af --filter "until=24h"

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            sleep 15
            curl -f http://localhost/api/health || echo "Health check endpoint not available"
            docker ps --format "table {{.Names}}\t{{.Status}}"
            sudo supervisorctl status kwamz-backend

      - name: Notify on success
        if: success()
        run: echo "Deployment successful!"

      - name: Notify on failure
        if: failure()
        run: echo "Deployment failed!"
