<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kwamz AI Verifier</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #f5f5f5;
      width: 280px;
      padding: 16px;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #111;
    }

    .subtitle {
      font-size: 11px;
      color: #888;
      margin-bottom: 14px;
    }

    .status-box {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
    }

    .status-title {
      font-size: 11px;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #statusText {
      font-size: 12px;
      color: #333;
      word-break: break-word;
      line-height: 1.5;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
      flex-shrink: 0;
    }

    .dot.active {
      background: #f59e0b;
      animation: pulse 1s infinite;
    }

    .dot.done { background: #22c55e; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>
</head>
<body>
  <h1>Kwamz AI Verifier</h1>
  <p class="subtitle">Automated KRA &amp; Police Clearance verification</p>

  <div class="status-box">
    <div class="status-title">
      <span class="dot" id="dot"></span>
      Current Status
    </div>
    <div id="statusText">Idle — waiting for verification jobs.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
