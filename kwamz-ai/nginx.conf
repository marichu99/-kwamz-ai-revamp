server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Streaming endpoints — disable all buffering so CDP frames flow immediately
    location /api/stream/ {
        proxy_pass http://host.docker.internal:5000/api/stream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # This container only ever listens on plain HTTP — $scheme is always
        # "http" here. TLS terminates at Cloudflare's edge, and the tunnel's
        # hop into this nginx is always http too, so the true public scheme
        # is always https; hardcode it so Flask's redirects aren't downgraded.
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # Proxy all other API requests to the Flask/gunicorn backend
    location /api/ {
        proxy_pass http://host.docker.internal:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # This container only ever listens on plain HTTP — $scheme is always
        # "http" here. TLS terminates at Cloudflare's edge, and the tunnel's
        # hop into this nginx is always http too, so the true public scheme
        # is always https; hardcode it so Flask's redirects aren't downgraded.
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # Handle client-side routing (important for Vite SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (Vite adds hash to filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

}