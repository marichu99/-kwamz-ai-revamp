services:
  frontend:
    build:
      context: ./kwamz-ai
      dockerfile: Dockerfile
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    network_mode: host
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    command: celery -A worker:celery beat -l info
    network_mode: host
    env_file:
      - ./backend/.env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # host network so the container reaches the bare-metal PostgreSQL
    # on localhost and Redis on localhost:6379 without any extra config
    network_mode: host
    env_file:
      - ./backend/.env
    environment:
      - FLASK_APP=run.py
      - FLASK_ENV=production
      - DISPLAY=:99
      # 2 vCPU / 4 GB droplet + 4 GB swap: 5 headful Chromiums is the
      # experiment ceiling — raise only after watching free -h under load
      - MAX_CONCURRENT_SCRAPES=5
      - SCRAPER_LOG_PATH=/app/logs/scraper.log
    volumes:
      # Persist logs to the host so scraper.log / gunicorn logs are accessible
      - ./logs:/app/logs
    command: >
      gunicorn
      --bind 0.0.0.0:5000
      --workers 1
      --threads 100
      --worker-class gthread
      --timeout 120
      --log-level info
      --access-logfile -
      --error-logfile -
      run:app
    restart: unless-stopped

volumes:
  redis_data:
